openapi: 3.0.3

info:
  title: Typoem API
  description: API for Typoem — a daily poem reading and annotation app for small private rooms.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: User registration and login
  - name: Users
    description: Authenticated user profile
  - name: Rooms
    description: Private rooms with invite codes
  - name: Dictionary
    description: Word definitions (cached proxy of the Free Dictionary API)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: jiseop
        nickname:
          type: string
          example: Jiseop

    Error:
      type: object
      properties:
        error:
          type: string
          example: "username already exists"
    
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "English Lit Study"
        description:
          type: string
          nullable: true
          example: "Our daily poetry room"
        invite_code:
          type: string
          example: "ABC123"
        owner_id:
          type: integer
          example: 1

    RoomWithCount:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          properties:
            member_count:
              type: integer
              example: 3

    RoomMember:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: jiseop
        nickname:
          type: string
          example: Jiseop
        role:
          type: string
          enum: [owner, member]
          example: owner

    WordEntry:
      type: object
      properties:
        word:
          type: string
          example: clever
        phonetic:
          type: string
          nullable: true
          example: "/ˈklɛvə/"
        definitions:
          type: array
          items:
            type: object
            properties:
              partOfSpeech:
                type: string
                example: adjective
              definition:
                type: string
                example: Quick to understand, learn, and devise or apply ideas.
              example:
                type: string
                nullable: true
                example: She is very clever at solving puzzles.
        cached:
          type: boolean
          description: True if the entry was served from word_cache instead of the external API.
          example: true

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, nickname, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: '^[a-zA-Z0-9_]+$'
                  example: jiseop
                nickname:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: Jiseop
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                  example: pw12345678
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: jiseop
                password:
                  type: string
                  example: pw12345678
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms:
    post:
      tags: [Rooms]
      summary: Create a new room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: "English Lit Study"
                description:
                  type: string
                  maxLength: 200
                  nullable: true
                  example: "Our daily poetry room"
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/mine:
    get:
      tags: [Rooms]
      summary: List rooms the current user belongs to
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomWithCount'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/join:
    post:
      tags: [Rooms]
      summary: Join a room with invite code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code:
                  type: string
                  example: "ABC123"
      responses:
        '201':
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Missing or invalid invite_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member of this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/{id}/members:
    get:
      tags: [Rooms]
      summary: List members of a room
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomMember'
        '400':
          description: Invalid room id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/{id}:
    delete:
      tags: [Rooms]
      summary: Delete a room (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Room deleted
        '400':
          description: Invalid room id
  /api/dictionary/{word}:
    get:
      tags: [Dictionary]
      summary: Look up a word definition
      description: >
        Returns the definition of a word. Checks the local word_cache first;
        on a cache miss it proxies the Free Dictionary API and caches the result.
      security:
        - bearerAuth: []
      parameters:
        - name: word
          in: path
          required: true
          description: English word to look up (letters, apostrophes, hyphens only).
          schema:
            type: string
          example: clever
      responses:
        '200':
          description: Word definition found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordEntry'
        '400':
          description: Invalid word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the owner can delete the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '404':
          description: Word not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/{id}/leave:
    delete:
      tags: [Rooms]
      summary: Leave a room (non-owner members)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Left the room
        '400':
          description: Invalid room id, or owner cannot leave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found or not a member
        '502':
          description: Dictionary service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'