<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poem History &middot; Typoem</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Masthead -->
  <header class="masthead">
    <div class="masthead-inner">
      <a href="/index.html" class="masthead-title">Typoem</a>
      <nav class="masthead-nav">
        <span id="nav-user" class="nav-user"></span>
        <button type="button" id="logout-btn" class="link-btn">Log out</button>
      </nav>
    </div>
    <p class="masthead-date" id="today"></p>
  </header>

  <!-- Global section bar -->
  <nav class="section-bar" aria-label="Sections">
    <div class="section-bar-inner">
      <a href="/index.html" class="section-link">My Rooms</a>
      <a href="/vocab.html" class="section-link">My Vocabulary</a>
    </div>
  </nav>

  <!-- Room sub-nav: room name left, room links right -->
  <nav class="room-subnav" aria-label="Room">
    <span class="room-name" id="room-name">&hellip;</span>
    <div class="room-subnav-links">
      <a id="back-to-room" href="/index.html">Today&rsquo;s Poem</a>
      <span class="sep">&middot;</span>
      <a href="#" class="is-active">Poem History</a>
    </div>
  </nav>

  <main class="page">
    <div class="page-headline">
      <h1 id="page-title">Poem History</h1>
      <div class="rule-double"></div>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="history-list" class="history-list" aria-live="polite"></section>

    <div id="history-empty" class="empty-state" hidden>
      <p class="empty-lead">No poems yet.</p>
      <p class="empty-sub">This room hasn&rsquo;t opened its first poem. Come back after today&rsquo;s reading.</p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="history.js"></script>

</body>
</html>
