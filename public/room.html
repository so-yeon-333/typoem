<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today&rsquo;s Poem &middot; Typoem</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Masthead -->
  <header class="masthead">
    <div class="masthead-inner">
      <a href="/index.html" class="masthead-title">Typoem</a>
      <nav class="masthead-nav">
        <span id="nav-user" class="nav-user"></span>
        <button type="button" id="logout-btn" class="link-btn">Log out</button>
      </nav>
    </div>
    <p class="masthead-date" id="today"></p>
  </header>

  <main class="page">
    <p class="back-link"><a href="/index.html">&larr; My Rooms</a></p>

    <div class="page-headline">
      <h1 id="room-name">&hellip;</h1>
      <div class="rule-double"></div>
    </div>

    <p id="status" class="status" role="status"></p>

    <div class="poem-layout">

      <!-- Today's poem -->
      <section class="poem-column" aria-label="Today's poem">
        <article class="poem-sheet">
          <h2 class="poem-title" id="poem-title"></h2>
          <p class="poem-author" id="poem-author"></p>
          <div class="rule-thin"></div>
          <div class="poem-body" id="poem-body"></div>
        </article>
      </section>

      <!-- Memos (full-poem notes) -->
      <aside class="memo-column" aria-label="Memos">
        <h4 class="panel-heading">Memos</h4>

        <div class="memo-compose">
          <textarea id="memo-input" class="note-input" rows="3"
            placeholder="Leave a memo on today&rsquo;s poem&hellip;" maxlength="1000"></textarea>
          <p id="memo-error" class="auth-error" role="alert"></p>
          <button type="button" id="memo-submit" class="btn">Post Memo</button>
        </div>

        <p id="memo-empty" class="empty-sub" hidden>No memos yet. Be the first.</p>
        <div id="memo-list" class="note-list" aria-live="polite"></div>
      </aside>

    </div>
  </main>

  <script src="auth.js"></script>
  <script src="room.js"></script>

</body>
</html>
